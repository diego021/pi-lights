[project]
name = "pi-lights"
version = "0.1.0"
description = "Lights control for Raspberry Pi 3B+"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[project.scripts]
pi-lights = "pi_lights:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
